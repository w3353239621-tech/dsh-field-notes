name: test

on:
  push:
  pull_request:

jobs:
  cards:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 只用 Node 内置模块，没有 npm install。
      - name: Check every card keeps its four-part shape
        run: node scripts/check-cards.mjs
